# ==============================================================================
# CODEXA NETLIFY DEPLOYMENT CONFIGURATION
# Optimized for high-speed edge delivery, security, forms & clean routing
# ==============================================================================

[build]
  publish = "."
  functions = ""

# Netlify Forms Handling
[forms]
  directory = "."

# Global HTTP Response Headers for Security & Performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://fonts.gstatic.com data: blob:;"

# Cache Static Assets for Faster Global CDN Delivery
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Clean URL Routing
[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/calendar"
  to = "/calendar.html"
  status = 200

[[redirects]]
  from = "/hire"
  to = "/index.html#workspace"
  status = 302

[[redirects]]
  from = "/audit"
  to = "/index.html#audit"
  status = 302
